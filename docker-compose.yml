version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: workgrid_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: workgrid
      POSTGRES_PASSWORD: workgrid_password
      POSTGRES_DB: workgrid
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workgrid -d workgrid']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workgrid_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=workgrid;Username=workgrid;Password=workgrid_password
      - JwtSettings__SecretKey=WorkGrid_SuperSecret_Jwt_Key_2024_Production_32chars!
      - JwtSettings__Issuer=WorkGridApi
      - JwtSettings__Audience=WorkGridClient
      - JwtSettings__ExpiresInDays=7
    ports:
      - '5000:80'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workgrid_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  postgres_data:
